<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DRIFT · The Track</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;700;800&display=swap">
<style>
body{margin:0;background:#07090d}
a{color:#3fa9f5}a:hover{color:#edeff2}
a:focus-visible,button:focus-visible{outline:2px solid #3fa9f5;outline-offset:3px}
</style>
</helmet>
<section id="track" style="width: 100%; box-sizing: border-box; background: #07090d; color: #edeff2; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; padding: 96px 40px;">
  <div style="max-width: 1360px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 64px; align-items: flex-start;">

    <div style="flex: 1 1 380px; max-width: 520px; display: flex; flex-direction: column; gap: 28px;">
      <p style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ff3b30;">S2 / The Track</p>
      <h2 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; font-weight: 800; font-size: 72px; line-height: 0.9; text-transform: uppercase;">Every corner<br>is a milestone</h2>
      <p style="margin: 0; font-size: 16px; line-height: 26px; color: #9aa1ac;">Education, work and the builds that changed the line. Scroll to drive the lap; the car marker follows the racing line.</p>
      <div style="background: #0e1117; border: 1px solid #262b33; border-radius: 6px; padding: 20px;">
        <svg role="img" aria-label="Track map with seven numbered corners, the last one still ahead" viewBox="0 0 400 290" style="width: 100%; height: auto; display: block;">
          <path d="M60 250 L300 250 Q360 250 360 200 L360 160 Q360 120 320 120 L240 120 Q210 120 200 90 L190 60 Q180 30 140 40 L80 56 Q40 68 40 116 L40 230 Q40 250 60 250 Z" fill="none" stroke="#161b22" stroke-width="22" stroke-linejoin="round"></path>
          <path d="M60 250 L300 250 Q360 250 360 200 L360 160 Q360 120 320 120 L240 120 Q210 120 200 90 L190 60 Q180 30 140 40 L80 56 Q40 68 40 116 L40 230 Q40 250 60 250 Z" fill="none" stroke="#5a616d" stroke-width="1.5" stroke-dasharray="6 8"></path>
          <path d="M200 250 L300 250 Q360 250 360 200 L360 160 Q360 120 320 120 L240 120 Q210 120 200 90 L190 60 Q180 30 140 40 L80 56 Q40 68 40 116 L40 160" fill="none" stroke="#e10600" stroke-width="3" stroke-linecap="round"></path>
          <g fill="#edeff2"><rect x="196" y="239" width="4" height="4"></rect><rect x="200" y="243" width="4" height="4"></rect><rect x="196" y="247" width="4" height="4"></rect><rect x="200" y="251" width="4" height="4"></rect><rect x="196" y="255" width="4" height="4"></rect><rect x="200" y="259" width="4" height="4"></rect></g>
          <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
            <circle cx="330" cy="250" r="11" fill="#07090d" stroke="#edeff2" stroke-width="1.5"></circle><text x="330" y="254" text-anchor="middle" fill="#edeff2">1</text>
            <circle cx="360" cy="150" r="11" fill="#07090d" stroke="#edeff2" stroke-width="1.5"></circle><text x="360" y="154" text-anchor="middle" fill="#edeff2">2</text>
            <circle cx="250" cy="120" r="11" fill="#07090d" stroke="#edeff2" stroke-width="1.5"></circle><text x="250" y="124" text-anchor="middle" fill="#edeff2">3</text>
            <circle cx="192" cy="64" r="11" fill="#07090d" stroke="#edeff2" stroke-width="1.5"></circle><text x="192" y="68" text-anchor="middle" fill="#edeff2">4</text>
            <circle cx="100" cy="50" r="11" fill="#07090d" stroke="#edeff2" stroke-width="1.5"></circle><text x="100" y="54" text-anchor="middle" fill="#edeff2">5</text>
            <circle cx="40" cy="128" r="11" fill="#e10600" stroke="#e10600" stroke-width="1.5"></circle><text x="40" y="132" text-anchor="middle" fill="#ffffff">6</text>
            <circle cx="40" cy="222" r="11" fill="#07090d" stroke="#ffb020" stroke-width="1.5" stroke-dasharray="3 3"></circle><text x="40" y="226" text-anchor="middle" fill="#ffb020">7</text>
          </g>
        </svg>
        <div style="display: flex; justify-content: space-between; padding-top: 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9aa1ac;">
          <span>Lap 2026</span>
          <span style="color: #ff3b30;">Current · T6</span>
        </div>
      </div>
    </div>

    <ol style="flex: 999 1 560px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
      <sc-for list="{{corners}}" as="c" hint-placeholder-count="7">
        <li style="display: grid; grid-template-columns: 64px 96px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 22px 0; border-top: 1px solid #262b33;">
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: {{c.codeColor}};">{{c.code}}</span>
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; font-weight: 500; color: #ffb020;">{{c.year}}</span>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <h3 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1; text-transform: uppercase;">{{c.title}}</h3>
            <p style="margin: 0; font-size: 16px; line-height: 26px; color: #9aa1ac;">{{c.text}}</p>
          </div>
        </li>
      </sc-for>
    </ol>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['[YEAR]', 'BSc Computer Science + Cybersecurity', 'The foundation: software, networks and security.'],
      ['2024', 'Security internship', 'Recon and scanning work, later rebuilt as web-security-scanner.'],
      ['[YEAR]', 'MSc Artificial Intelligence, Ulster', 'Robotics, ML and AI ethics coursework, plus the warehouse robot group project.'],
      ['2026', 'Financial-NRF', 'Dissertation and paper draft: do LLM reliability scores notice when the source is wrong? Mostly no.'],
      ['2026', 'Tom & Ollie relaunch', 'First real client: a storefront for a Belfast cheesemonger.'],
      ['2026', 'Warden and AEGIS', 'AI security agents that only ship a defence after it passes validation.'],
      ['Next', 'The next corner', 'AI engineering, AI security or MLOps. Let’s talk.']
    ];
    return {
      corners: rows.map((r, i) => ({
        code: i === 5 ? 'T' + (i + 1) + ' ●' : 'T' + (i + 1),
        codeColor: i === 5 ? '#ff3b30' : '#9aa1ac',
        year: r[0], title: r[1], text: r[2]
      }))
    };
  }
}
</script>
</body>
</html>
